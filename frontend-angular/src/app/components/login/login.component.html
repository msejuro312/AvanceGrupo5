<div class="box-login">
  <div class="card shadow-lg">
    <div class="card-header text-center text-white">
      <h3><i class="fas fa-cubes me-2"></i>SERFAGAB</h3>
      <small class="opacity-75">Sistema de Gestión de Compras</small>
    </div>

    <div class="card-body">
      <h5 class="text-center mb-4">
        <i class="fas fa-sign-in-alt me-2 text-dark"></i>Inicio de Sesión
      </h5>

      <div *ngIf="mensajeError" class="alert alert-danger py-2">{{ mensajeError }}</div>

      <form (submit)="$event.preventDefault(); iniciarSesion()" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold">
            <i class="fas fa-user me-1"></i> Login
          </label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
            <input type="text" class="form-control" placeholder="Ingrese su login"
                   name="login" [(ngModel)]="login" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">
            <i class="fas fa-key me-1"></i> Clave
          </label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
            <input type="password" class="form-control" placeholder="Ingrese su clave"
                   name="clave" [(ngModel)]="clave" required>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-dark" [disabled]="cargando">
            <span *ngIf="!cargando">
              <i class="fas fa-sign-in-alt me-2"></i>INGRESAR
            </span>
            <span *ngIf="cargando">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              Ingresando...
            </span>
          </button>
        </div>
      </form>
    </div>

    <div class="card-footer text-muted text-center">
      &copy; 2025 SERFAGAB - Todos los derechos reservados
    </div>
  </div>
</div>
